# Initial setup
set-option -g default-terminal "screen-256color"
set -as terminal-features ',screen-256color:clipboard'
set -s set-clipboard on

set -ga terminal-overrides ",screen-256color:Tc"

# Set prefix to ctrl-a (same as screen)
set-option -g prefix C-a

# C-a prefix twice will "forward" it to the actual app
unbind-key C-a
bind-key   C-a send-prefix

# Disable pane switching via esc key
set -s escape-time 0

# Set the base-index to 1 rather than 0
set -g base-index 1
set-window-option -g pane-base-index 1


# status bar settings
set-option -g status-position top
set -g status-style 'bg=black,fg=white'
set -g status-left '#[bold]#S '
set -g status-left-length 20
# set -g status-right '%H:%M'
set -g window-status-current-format '#[reverse]#I:#W*#[default]'

# set number of lines
set-option -g history-limit 100000

# mouse support
set -g mouse off

# Set easier window split keys
bind-key v split-window -h
bind-key h split-window -v

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Toggle sync keyboard input to all panes
unbind a
bind-key a set-window-option synchronize-panes \; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"

# Key bindings for copy-paste
unbind p
bind p paste-buffer

# Prefix r to reload this config
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded tmux.conf"

# create three-pane window
unbind C-c
bind C-c new-window -n 'ws' \; split-window -v \; split-window -h \;

# remap clear screen
bind C-l send-keys 'C-l'
bind-key -n     'C-M-l'     'send-keys C-l'

# seamless tmux/nvim navigation: pass keys to nvim when the pane runs nvim, else move tmux panes (stop at edges, no wrap)
bind-key -n C-h if-shell -F "#{@nvim_active}" 'send-keys C-h' 'if-shell -F "#{pane_at_left}" "" "select-pane -L"'
bind-key -n C-j if-shell -F "#{@nvim_active}" 'send-keys C-j' 'if-shell -F "#{pane_at_bottom}" "" "select-pane -D"'
bind-key -n C-k if-shell -F "#{@nvim_active}" 'send-keys C-k' 'if-shell -F "#{pane_at_top}" "" "select-pane -U"'
bind-key -n C-l if-shell -F "#{@nvim_active}" 'send-keys C-l' 'if-shell -F "#{pane_at_right}" "" "select-pane -R"'

# terminal
unbind 1
unbind 2
unbind 3
unbind 4
bind 1 display-popup -w 90% -h 90% -E
bind 2 display-popup -w 90% -h 90% -E jshell
bind 3 display-popup -w 90% -h 90% -E copilot

# nvim suggestions
set-option -g focus-events on

# copy-paste
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
if-shell 'uname | grep -q Darwin' {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel -ib"
}
